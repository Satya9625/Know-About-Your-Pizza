
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know About Your Pizza</title> 
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: url('https://cdn.pixabay.com/photo/2023/06/13/10/59/ai-generated-8060682_1280.jpg') no-repeat center center/cover;
  margin: 0;
  padding: 0;
  color: #fff;
}
.overlay {
  background: rgba(0,0,0,0.7);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container {
  background: rgba(255, 69, 0, 0.9);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  max-width: 500px;
  width: 100%;
  box-shadow: 0 8px 20px rgba(0,0,0,0.6);
}
h1 { margin-bottom: 20px; font-size: 2rem; text-shadow: 2px 2px 4px #000; }
select, button {
  padding: 10px;
  margin: 10px;
  border-radius: 8px;
  border: none;
  font-size: 1rem;
}
button {
  background: #ffd700;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
button:hover { background: #ffae00; }
.result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #fff;
  color: #000;
  font-size: 1rem;
  text-align: left;
}
</style>
</head>
<body>
<div class="overlay">
  <div class="container">
    <h1>🍕 Know About Your Pizza 🍕</h1>
    <label for="pizza">Choose Pizza:</label>
    <select id="pizza">
      <option value="Spicy Tango Cheese Pizza">Spicy Tango Cheese Pizza</option>
      <option value="Double Cheese Margherita">Double Cheese Margherita</option>
      <option value="FarmFresh Pizza">FarmFresh Pizza</option>
      <option value="Green Mexican Pizza">Green Mexican Pizza</option>
      <option value="Country Feast Pizza">Country Feast Pizza</option>
      <option value="Peppy Paneer Pizza">Peppy Paneer Pizza</option>
      <option value="Veg Paradise Pizza">Veg Paradise Pizza</option>
      <option value="Full Spicy Pizza">Full Spicy Pizza</option>
      <option value="Extravaganza Feast Pizza">Extravaganza Feast Pizza</option>
      <option value="Veggie Lover Pizza">Veggie Lover Pizza</option>
      <option value="Veg Deluxe Pizza">Veg Deluxe Pizza</option>
    </select>
    <br>
    <label for="size">Choose Size:</label>
    <select id="size">
      <option value="Small">Small</option>
      <option value="Medium">Medium</option>
      <option value="Large">Large</option>
    </select>
    <br>
    <button onclick="showNutrition()">Show Nutrition</button>
    <div class="result" id="result">Nutrition values will appear here...</div>
  </div>
</div>

<script>
const nutritionData = {
  "Spicy Tango Cheese Pizza": {
    Small: {Calories: 797, Protein: 27.6, Carbohydrates: 142.1, Fibre: 5.75, Fat: 11.92},
    Medium: {Calories: 1090, Protein: 37.7, Carbohydrates: 194, Fibre: 7.8, Fat: 16.2},
    Large: {Calories: 1337, Protein: 46.6, Carbohydrates: 238, Fibre: 9.5, Fat: 20.5}
  },
  "Double Cheese Margherita": {
    Small: {Calories: 899, Protein: 34.4, Carbohydrates: 138.5, Fibre: 4.96, Fat: 21.6},
    Medium: {Calories: 1199, Protein: 45.8, Carbohydrates: 184.35, Fibre: 6.61, Fat: 28.8},
    Large: {Calories: 1499, Protein: 57.3, Carbohydrates: 230.4, Fibre: 8.26, Fat: 36}
  },
  "FarmFresh Pizza": {
    Small: {Calories: 819, Protein: 28.3, Carbohydrates: 143, Fibre: 6.3, Fat: 12.2},
    Medium: {Calories: 1120, Protein: 38.8, Carbohydrates: 195, Fibre: 8.4, Fat: 16.6},
    Large: {Calories: 1370, Protein: 48.1, Carbohydrates: 239, Fibre: 10.2, Fat: 20.8}
  },
  "Green Mexican Pizza": {
    Small: {Calories: 828, Protein: 28.4, Carbohydrates: 143.7, Fibre: 6.58, Fat: 12.2},
    Medium: {Calories: 1132, Protein: 39, Carbohydrates: 196, Fibre: 8.77, Fat: 16.6},
    Large: {Calories: 1385, Protein: 48.6, Carbohydrates: 240.3, Fibre: 10.95, Fat: 20.8}
  },
  "Country Feast Pizza": {
    Small: {Calories: 814, Protein: 28.2, Carbohydrates: 143, Fibre: 6.1, Fat: 12.2},
    Medium: {Calories: 1115, Protein: 38.7, Carbohydrates: 195, Fibre: 8.3, Fat: 16.6},
    Large: {Calories: 1363, Protein: 48, Carbohydrates: 239, Fibre: 10, Fat: 20.8}
  },
  "Peppy Paneer Pizza": {
    Small: {Calories: 864, Protein: 31.5, Carbohydrates: 144, Fibre: 6.4, Fat: 15.2},
    Medium: {Calories: 1180, Protein: 43, Carbohydrates: 196, Fibre: 8.7, Fat: 20.8},
    Large: {Calories: 1436, Protein: 54, Carbohydrates: 240, Fibre: 10.7, Fat: 26}
  },
  "Veg Paradise Pizza": {
    Small: {Calories: 852, Protein: 29.5, Carbohydrates: 145, Fibre: 6.9, Fat: 14.1},
    Medium: {Calories: 1162, Protein: 40.5, Carbohydrates: 198, Fibre: 9.2, Fat: 19.2},
    Large: {Calories: 1415, Protein: 51.5, Carbohydrates: 243, Fibre: 11.5, Fat: 24.2}
  },
  "Full Spicy Pizza": {
    Small: {Calories: 835, Protein: 28.6, Carbohydrates: 143, Fibre: 6.7, Fat: 12.9},
    Medium: {Calories: 1140, Protein: 39.2, Carbohydrates: 196, Fibre: 8.9, Fat: 17.2},
    Large: {Calories: 1392, Protein: 48.9, Carbohydrates: 240, Fibre: 11, Fat: 21.5}
  },
  "Extravaganza Feast Pizza": {
    Small: {Calories: 848, Protein: 29.3, Carbohydrates: 145, Fibre: 7.3, Fat: 13},
    Medium: {Calories: 1155, Protein: 40.3, Carbohydrates: 198, Fibre: 9.5, Fat: 17.5},
    Large: {Calories: 1410, Protein: 51.4, Carbohydrates: 243, Fibre: 11.8, Fat: 22}
  },
  "Veggie Lover Pizza": {
    Small: {Calories: 840, Protein: 29, Carbohydrates: 144, Fibre: 7.1, Fat: 13},
    Medium: {Calories: 1145, Protein: 39.8, Carbohydrates: 197, Fibre: 9.3, Fat: 17.3},
    Large: {Calories: 1398, Protein: 50.6, Carbohydrates: 242, Fibre: 11.5, Fat: 21.8}
  },
  "Veg Deluxe Pizza": {
    Small: {Calories: 885, Protein: 32.8, Carbohydrates: 145, Fibre: 7.5, Fat: 15.4},
    Medium: {Calories: 1205, Protein: 44.5, Carbohydrates: 198, Fibre: 9.9, Fat: 20.6},
    Large: {Calories: 1465, Protein: 56.3, Carbohydrates: 243, Fibre: 12.3, Fat: 25.8}
  }
};

function showNutrition() {
  const pizza = document.getElementById("pizza").value;
  const size = document.getElementById("size").value;
  const data = nutritionData[pizza][size];

  if (!data) {
    document.getElementById("result").innerHTML = "Nutrition data not available!";
    return;
  }

  document.getElementById("result").innerHTML = `
    <h3>Nutrition Summary (${size}):</h3>
    <p><b>Calories:</b> ${data.Calories} kcal</p>
    <p><b>Protein:</b> ${data.Protein} g</p>
    <p><b>Carbohydrates:</b> ${data.Carbohydrates} g</p>
    <p><b>Fibre:</b> ${data.Fibre} g</p>
    <p><b>Fat:</b> ${data.Fat} g</p>
  `;
}
</script>
</body>
</html>
